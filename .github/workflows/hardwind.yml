name: Relevar precios de Hard Wind

# Relevamiento diario de la pestaña "Hard Wind" (sección de equipos):
# 1. llama a /api/hardwind categoría por categoría y página por página, con
#    3 s de pausa entre pedidos, y después junta el resultado en el historial;
# 2. corre scripts/hardwind_scraper.py (Playwright) y deja prices.csv como
#    archivo descargable de la corrida.

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'   # todos los días, 06:37 hora Argentina

concurrency:
  group: relevar-hardwind
  cancel-in-progress: false

jobs:
  relevar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://escueladewingfoil.com.ar/api/hardwind
    steps:
      - name: Relevar cada categoría
        run: |
          datos=$(curl -sfL "$API?t=$(date +%s)")
          max=$(echo "$datos" | jq -r '.maxPaginas')
          for cat in $(echo "$datos" | jq -r '.categorias[].id'); do
            for pagina in $(seq 1 "$max"); do
              r=$(curl -s -X POST -H "content-type: application/json" -d "{\"cat\":\"$cat\",\"pagina\":$pagina}" "$API")
              echo "$cat $pagina $r"
              sleep 3
              [ "$(echo "$r" | jq -r '.mas')" = "true" ] || break
            done
          done
          curl -sf -X POST -H "content-type: application/json" -d '{"cerrar":1}' "$API" | jq .

  csv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/hardwind_scraper.py
      - uses: actions/upload-artifact@v4
        with:
          name: prices-${{ github.run_id }}
          path: prices.csv
          retention-days: 30
