# WORKFLOW TEMPORAL — sonda de viabilidad, se elimina después de usarlo.
# Existe solo porque GitHub exige que un workflow esté en la rama por defecto
# para poder dispararlo a mano. No escribe nada: contents: read y sin commits.
name: SONDA — pronóstico de viento

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probar Open-Meteo en los 17 spots
        run: node probe-clima.js
