name: sonda-batimetria
on: [push]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: GeoServer del SHN
        run: |
          set +e
          echo '' | base64 -d > /tmp/capas.py
          echo "############ 1. CORS del GeoServer ############"
          curl -sS -D - -o /dev/null --max-time 30 -H "Origin: https://escueladewingfoil.com" "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" | grep -iE 'HTTP/|access-control|content-type'
          echo "############ 2. Capas WMS ############"
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" -o /tmp/wms.xml
          python3 /tmp/capas.py /tmp/wms.xml WMS
          echo "############ 3. Feature types WFS ############"
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities" -o /tmp/wfs.xml
          python3 /tmp/capas.py /tmp/wfs.xml WFS
          echo "############ 4. SHN Datos Abiertos ############"
          curl -sSL --max-time 40 "https://www.hidro.gov.ar/DA/DatosAbiertos.asp" -o /tmp/da.html -w "http=%{http_code} bytes=%{size_download}\n"
          grep -oiE 'href="[^"]{3,120}"' /tmp/da.html | sort -u | head -40
          echo "--- texto visible ---"
          sed 's/<[^>]*>/ /g' /tmp/da.html | tr -s ' \n' ' \n' | grep -viE '^[[:space:]]*$' | head -60
          echo "############ 5. SHN download.asp ############"
          curl -sSL --max-time 40 "https://www.hidro.gov.ar/download/download.asp" -o /tmp/dl.html -w "http=%{http_code} bytes=%{size_download}\n"
          sed 's/<[^>]*>/ /g' /tmp/dl.html | tr -s ' \n' ' \n' | grep -viE '^[[:space:]]*$' | head -50
          grep -oiE 'href="[^"]{3,120}"' /tmp/dl.html | sort -u | head -30
          echo "FIN SONDA 4"
