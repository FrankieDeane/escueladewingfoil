name: sonda-batimetria
on: [push]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Capas del GeoServer del SHN
        run: |
          set +e
          echo '' | base64 -d > /tmp/capas.py
          echo "=== CORS (esto decide si se puede leer desde el navegador) ==="
          curl -sS -D - -o /dev/null --max-time 30 -H "Origin: https://escueladewingfoil.com" "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" | grep -iE 'HTTP/|access-control'
          echo "=== WMS ==="
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" -o /tmp/wms.xml
          python3 /tmp/capas.py /tmp/wms.xml WMS
          echo "=== WFS ==="
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities" -o /tmp/wfs.xml
          python3 /tmp/capas.py /tmp/wfs.xml WFS
          echo "FIN"
