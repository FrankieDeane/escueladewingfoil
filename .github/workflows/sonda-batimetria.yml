name: sonda-batimetria
on: [push]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: GeoServer del SHN
        run: |
          set +e
          echo "############ 1. CORS del GeoServer (decide si se puede usar desde el navegador) ############"
          curl -sS -D - -o /dev/null --max-time 30 -H "Origin: https://escueladewingfoil.com" \
            "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" | grep -iE 'HTTP/|access-control|content-type'

          echo "############ 2. Que capas publica (WMS) ############"
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" -o /tmp/wms.xml
          echo "bytes: $(wc -c < /tmp/wms.xml)"
          python3 - <<'PYEOF'
import re
x = open('/tmp/wms.xml', encoding='utf-8', errors='replace').read()
capas = re.findall(r'<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>', x)
print("total capas:", len(capas))
for n, t in capas:
    print("  %-45s | %s" % (n[:45], t[:70]))
PYEOF

          echo "############ 3. Que publica por WFS (esto SI se puede bajar como datos) ############"
          curl -sS --max-time 40 "https://geoportal.shn.gob.ar/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities" -o /tmp/wfs.xml
          python3 - <<'PYEOF'
import re
x = open('/tmp/wfs.xml', encoding='utf-8', errors='replace').read()
tipos = re.findall(r'<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>', x)
print("total feature types:", len(tipos))
for n, t in tipos:
    print("  %-45s | %s" % (n[:45], t[:70]))
print("--- formatos de salida ---")
print(sorted(set(re.findall(r'<ows:Value>(application/[^<]+|[a-zA-Z0-9/+.-]*json[^<]*)</ows:Value>', x)))[:15])
PYEOF

          echo "############ 4. SHN Datos Abiertos ############"
          curl -sSL --max-time 40 "https://www.hidro.gov.ar/DA/DatosAbiertos.asp" -o /tmp/da.html -w "http=%{http_code} bytes=%{size_download}\n"
          grep -oiE 'href="[^"]{3,120}"' /tmp/da.html | sort -u | head -40
          echo "--- archivos ---"
          grep -oiE '[A-Za-z0-9_./%-]+\.(zip|csv|txt|xyz|json|geojson|shp|kmz|kml|tif|xlsx?)' /tmp/da.html | sort -u | head -30
          echo "--- texto visible ---"
          sed 's/<[^>]*>/ /g' /tmp/da.html | tr -s ' \n' ' \n' | grep -viE '^\s*$' | head -60

          echo "############ 5. SHN download.asp ############"
          curl -sSL --max-time 40 "https://www.hidro.gov.ar/download/download.asp" -o /tmp/dl.html -w "http=%{http_code} bytes=%{size_download}\n"
          sed 's/<[^>]*>/ /g' /tmp/dl.html | tr -s ' \n' ' \n' | grep -viE '^\s*$' | head -50
          grep -oiE 'href="[^"]{3,120}"' /tmp/dl.html | sort -u | head -30
          echo "FIN SONDA 4"
