name: sonda-batimetria
on: [push]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Cuanta resolucion hay realmente
        run: |
          set +e
          pip install pillow -q
          echo '' | base64 -d > /tmp/sonda.py
          python3 /tmp/sonda.py

          echo "############ C. GEBCO WMS: capas y si sirve numeros ############"
          curl -sS --max-time 40 "https://wms.gebco.net/mapserv?request=getcapabilities&service=wms&version=1.3.0" -o /tmp/cap.xml
          echo "--- capas ---"
          grep -oE '<Name>[^<]+</Name>' /tmp/cap.xml | sort -u | head -20
          echo "--- formatos de GetFeatureInfo ---"
          grep -oE '<Format>[^<]+</Format>' /tmp/cap.xml | sort -u | head -12
          echo "--- imagen del Rio de la Plata ---"
          curl -sS --max-time 60 -o /tmp/g.png -w "http=%{http_code} bytes=%{size_download} type=%{content_type}\n" "https://wms.gebco.net/mapserv?request=GetMap&service=WMS&version=1.3.0&layers=GEBCO_LATEST&format=image/png&crs=EPSG:4326&bbox=-36.6,-59,-34,-55&width=800&height=520"
          file /tmp/g.png

          echo "############ D. SHN: links y secciones ############"
          curl -sSL --max-time 40 "https://www.hidro.gov.ar/" -o /tmp/shn.html
          grep -oiE 'href="[^"]{3,90}"' /tmp/shn.html | sort -u | head -60

          echo "############ E. OpenSeaMap (cartas nauticas libres) ############"
          curl -sS -o /tmp/osm.png -D /tmp/osmh.txt -w "seamark z12 http=%{http_code} bytes=%{size_download} type=%{content_type}\n" --max-time 40 "https://tiles.openseamap.org/seamark/12/1450/2455.png"
          grep -i 'access-control' /tmp/osmh.txt | head -3
          file /tmp/osm.png
          echo "FIN DE LA SONDA 2"
