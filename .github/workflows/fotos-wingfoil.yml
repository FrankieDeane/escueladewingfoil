name: Bajar fotos de wingfoil

# Baja fotos de Unsplash (licencia libre) por número, las achica para web
# (1600 px y 800 px, JPG calidad 72) y las guarda en assets/img/ en la misma
# rama. Corre solo cuando cambia este archivo.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fotos-wingfoil.yml']

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDS: >-
        1730134427101-ec7982a3d773 1740688244435-047d479f8113 1666175497565-1c366074f2b2 1666175497932-8c88bbad53b1 1740688245004-d4e836b7eb58 1666175497562-ccb66e6c373b 1652732255684-d92200fffa0f 1666175497584-dab60dcf1419 1666175496646-6b5ad13b902f 1730134427096-c167c128e119 1740688244924-4deca73383dc 1666175497804-e28c2d800ab9 1666175496147-9faf7d295503
      UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Bajar y achicar
        run: |
          mkdir -p assets/img
          for id in $IDS; do
            curl -sfL -A "$UA" -o /tmp/$id.jpg "https://images.unsplash.com/photo-$id?w=2000&q=85&fm=jpg" || { echo "falló $id"; continue; }
            python3 - "$id" <<'PY'
          import sys
          from PIL import Image, ImageOps
          i = sys.argv[1]
          im = ImageOps.exif_transpose(Image.open(f'/tmp/{i}.jpg')).convert('RGB')
          for lado, sufijo, q in ((1600, '', 72), (800, '-800', 70)):
              c = im.copy(); c.thumbnail((lado, lado))
              c.save(f'assets/img/wf-{i}{sufijo}.jpg', quality=q, optimize=True, progressive=True)
          PY
          done
          ls -la assets/img | head -100
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet && exit 0
          git commit -m "Fotos de wingfoil (Unsplash, licencia libre) achicadas para web"
          git pull --rebase
          git push
