name: Bajar fotos de wingfoil

# Baja fotos de Pexels (licencia libre) por número, las achica para web
# (1600 px y 800 px, JPG calidad 72) y las guarda en assets/img/ en la misma
# rama. Corre solo cuando cambia este archivo.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fotos-wingfoil.yml']

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDS: >-
        33834659 14447157 14740926 23355184 14447119 19532133 40076942 15151070
        17901682 18388700 39731095 19532131 18388624 13910811 14447118 13910810
        33834673 38999274 33834675 13910812 13910772 14740931 19169575 19532132
        18546149 33834676 19169514 18388625 19169526 33834674 13910809 14476472
        33008695 13910773 18388623 23190954
      UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36
    steps:
      - uses: actions/checkout@v4
      - name: Bajar y achicar
        run: |
          mkdir -p assets/img
          for id in $IDS; do
            curl -sfL -A "$UA" -o /tmp/$id.jpg "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || { echo "falló $id"; continue; }
            convert /tmp/$id.jpg -strip -resize '1600x1600>' -quality 72 -interlace Plane assets/img/wf-$id.jpg
            convert /tmp/$id.jpg -strip -resize '800x800>' -quality 70 -interlace Plane assets/img/wf-$id-800.jpg
          done
          ls -la assets/img | head -100
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet && exit 0
          git commit -m "Fotos de wingfoil (Pexels, licencia libre) achicadas para web"
          git pull --rebase
          git push
