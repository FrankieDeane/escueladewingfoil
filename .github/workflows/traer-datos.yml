name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: pip install pillow -q
      - run: |
          echo '' | base64 -d > /tmp/sat.py
          mkdir -p datos
          python3 /tmp/sat.py 2>&1 | tee datos/sat-log.txt
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f datos/
          git diff --cached --quiet && exit 0
          git commit -m 'Textura satelital y terreno del strip de costa de San Isidro'
          git push origin HEAD:claude/rio-3d-san-isidro
