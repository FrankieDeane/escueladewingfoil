name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: |
          echo '' | base64 -d > /tmp/smn.py
          mkdir -p datos
          python3 /tmp/smn.py 2>&1 | tee datos/smn-log.txt
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f datos/smn-log.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Sonda: CNSI y SMN'
          git push origin HEAD:claude/rio-3d-san-isidro
