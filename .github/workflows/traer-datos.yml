name: traer-datos-san-isidro
on: [push]
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/rio-3d-san-isidro
      - name: Dependencias
        run: pip install pillow rasterio numpy -q
      - name: Traer datos reales del recorte
        run: |
          echo '' | base64 -d > /tmp/traer.py
          python3 /tmp/traer.py
      - name: Preview del GEBCO de Source Cooperative
        run: |
          echo '' | base64 -d > /tmp/gebco.py
          python3 /tmp/gebco.py 2>&1 | tee datos/gebco-log.txt
      - name: Commitear
        if: always()
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f datos/
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Datos reales + preview GEBCO (Source Cooperative)"
          git push origin HEAD:claude/rio-3d-san-isidro
