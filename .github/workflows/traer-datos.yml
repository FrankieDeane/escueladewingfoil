name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium && pip install pillow -q
      - run: |
          echo '' | base64 -d > e2e2.mjs
          echo '' | base64 -d > /tmp/mirar.py
          mkdir -p datos
          node e2e2.mjs 2>&1 | tee datos/e2e2.txt
          python3 /tmp/mirar.py 2>&1 | tee -a datos/e2e2.txt
          cp /tmp/lienzo-*.png datos/ || true
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          rm -f e2e2.mjs package.json package-lock.json
          git add -f datos/e2e2.txt datos/lienzo-*.png
          git diff --cached --quiet && exit 0
          git commit -m 'Captura real del lienzo 3D en el deploy preview'
          git push origin HEAD:claude/rio-3d-san-isidro
