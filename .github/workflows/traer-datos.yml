name: traer-datos-san-isidro
on: [push]
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/rio-3d-san-isidro
      - name: Instalar Pillow
        run: pip install pillow -q
      - name: Traer datos reales
        run: |
          echo '' | base64 -d > /tmp/traer.py
          python3 /tmp/traer.py
      - name: Commitear los datos
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f datos/
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Datos reales del recorte de San Isidro (traidos por Actions)"
          git push origin HEAD:claude/rio-3d-san-isidro
