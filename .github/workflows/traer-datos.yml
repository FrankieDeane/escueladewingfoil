name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - run: |
          echo '' | base64 -d > v104.mjs
          mkdir -p datos
          node v104.mjs 2>&1 | tee datos/v104.txt
          cp /tmp/v104-*.png datos/ || true
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          rm -f v104.mjs package.json package-lock.json
          git add -f datos/v104.txt datos/v104-*.png
          git diff --cached --quiet && exit 0
          git commit -m 'Verificacion del preview 104'
          git push origin HEAD:claude/rio-3d-san-isidro
