name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - run: |
          echo '' | base64 -d > /tmp/e2e.mjs
          cp /tmp/e2e.mjs ./e2e.mjs
          mkdir -p datos
          node e2e.mjs 2>&1 | tee datos/e2e.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: capturas, path: /tmp/e2e-*.png, if-no-files-found: ignore}
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          rm -f e2e.mjs package.json package-lock.json
          git add -f datos/e2e.txt
          git diff --cached --quiet && exit 0
          git commit -m 'E2E contra el deploy preview'
          git push origin HEAD:claude/rio-3d-san-isidro
