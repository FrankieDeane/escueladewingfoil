name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - run: |
          echo '' | base64 -d > v105.mjs
          mkdir -p datos
          node v105.mjs 2>&1 | tee datos/v105.txt
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          rm -f v105.mjs package.json package-lock.json
          git add -f datos/v105.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Verificacion del fix de Bramador en el preview 105'
          git push origin HEAD:claude/rio-3d-san-isidro
