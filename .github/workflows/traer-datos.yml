name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - run: |
          sleep 90
          echo '' | base64 -d > vresp.mjs
          mkdir -p datos
          node vresp.mjs 2>&1 | tee datos/vresp.txt
          cp /tmp/pv-*.png datos/ || true
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          rm -f vresp.mjs package.json package-lock.json
          git add -f datos/vresp.txt datos/pv-*.png
          git diff --cached --quiet && exit 0
          git commit -m 'Verificacion responsive contra el preview'
          git push origin HEAD:claude/rio-3d-san-isidro
