name: sonda-detalle
on: [push]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: |
          echo '' | base64 -d > /tmp/com.py
          python3 /tmp/com.py 2>&1 | tee datos/comunidad-log.txt
      - if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f datos/
          git diff --cached --quiet && exit 0
          git commit -m 'Viento real alineado con marea, costa y fondo del SHN'
          git push origin HEAD:claude/rio-3d-san-isidro
