name: traer-datos-san-isidro
on: [push]
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/rio-3d-san-isidro}
      - run: pip install pillow rasterio numpy -q
      - name: Preview GEBCO 2026 desde Source Cooperative
        run: |
          echo '' | base64 -d > /tmp/gebco.py
          python3 /tmp/gebco.py 2>&1 | tee datos/gebco-log.txt
      - name: Commitear
        if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f datos/
          git diff --cached --quiet && exit 0
          git commit -m "Preview GEBCO 2026 (Source Cooperative) con procedencia TID"
          git push origin HEAD:claude/rio-3d-san-isidro
