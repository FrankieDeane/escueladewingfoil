name: Prueba Hard Wind (temporal)
on:
  push:
    branches: [claude/project-thread-x8qspj]
    paths: [.github/workflows/hardwind-probe.yml, scripts/hardwind-parse.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in wing/ foil/page/4/ usado/ neoprenes/ accesorios1/ straps-y-botas/; do
            curl -sL -A 'Mozilla/5.0' "https://hardwind.com/$u" -o "p.html"
            node -e "
              import('./scripts/hardwind-parse.mjs').then(({parseCategoria}) => {
                const ps = parseCategoria(require('fs').readFileSync('p.html','utf8'));
                const c = (k) => ps.filter(p => p[k] != null && p[k] !== false).length;
                console.log('$u', ps.length, 'cat', c('categoria'), 'precio', c('precio'), 'url', c('url'), 'img', c('imagen'), 'transf', c('precioTransferencia'), 'disp', c('disponible'), 'consultar', c('consultar'), 'anterior', c('precioAnterior'));
                console.log(JSON.stringify(ps.slice(0, 2)));
              });"
            sleep 3
          done
