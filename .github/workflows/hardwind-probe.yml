name: Prueba Hard Wind (temporal)
on:
  push:
    branches: [claude/project-thread-x8qspj]
    paths: [.github/workflows/hardwind-probe.yml, scripts/hardwind_scraper.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          curl -sL -A 'Mozilla/5.0' 'https://hardwind.com/wing/' -o p.html
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8').read()
          j=h.find('class="js-item-product'); b=h[j:h.find('class="js-item-product',j+10)]
          b=re.sub(r'data-variants="[^"]*"','data-variants="…"',b)
          print(b[:6000])
          PY
          for n in 5 8 30; do curl -s -o /dev/null -w "page $n -> %{http_code} %{size_download}\n" -A 'Mozilla/5.0' "https://hardwind.com/wing/page/$n/"; done
          curl -sL -A 'Mozilla/5.0' 'https://hardwind.com/wing/page/30/' | grep -c 'class="js-item-product' || true
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/hardwind_scraper.py wing foil && head -20 prices.csv && wc -l prices.csv
