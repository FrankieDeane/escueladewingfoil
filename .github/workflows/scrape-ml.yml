name: Relevar productos de Mercado Libre

# Dispara el relevamiento diario de la vidriera de Mercado Libre (/equipos):
# llama a /api/ml-dashboard búsqueda por búsqueda y después junta el resultado
# en el historial. El pedido a Mercado Libre lo hace la función de Netlify por
# la API oficial; si la app de ML no está cargada, responde 503 y este
# workflow termina sin cambios.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'   # todos los días, 06:17 hora Argentina

concurrency:
  group: relevar-ml
  cancel-in-progress: false

jobs:
  relevar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://escueladewingfoil.com.ar/api/ml-dashboard
    steps:
      - name: Relevar cada link
        run: |
          total=$(curl -sfL "$API?t=$(date +%s)" | jq -r '.links')
          servicio=$(curl -sfL "$API?t=$(date +%s)" | jq -r '.servicio')
          if [ "$servicio" != "true" ]; then echo "Relevamiento automático sin configurar (MELI_CLIENT_ID)"; exit 0; fi
          echo "Búsquedas: $total"
          seq 0 $((total - 1)) | xargs -P 4 -I{} sh -c \
            'curl -s -X POST -H "content-type: application/json" -d "{\"i\":{}}" "$API" | jq -c "{i, ok, error}"'
          curl -sf -X POST -H "content-type: application/json" -d '{"cerrar":1}' "$API" | jq .
