# PRUEBA TEMPORAL — se elimina apenas tengamos el resultado.
# Los tests del "¿Salgo hoy?" corren con la respuesta de Open-Meteo simulada,
# porque el entorno de desarrollo no tiene salida a internet. Esto corre el
# mismo código contra la API real, para ver los números de verdad.
name: PRUEBA — ¿Salgo hoy? contra la API real

on: pull_request

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y && npm install jsdom --no-audit --no-fund
      - name: Correr el "¿Salgo hoy?" con viento real
        run: node prueba-salgo-hoy.mjs
