<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Comparador Wingfoil</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="head__logo">🌊</span>
    <div>
      <b>Comparador Wingfoil</b>
      <small id="headSub">Buscando publicación…</small>
    </div>
  </header>

  <main id="app">
    <div class="state" id="stateEmpty" hidden>
      <p>Abrí una publicación de equipo de wingfoil en <b>Mercado Libre</b> y volvé a hacer clic en la extensión.</p>
    </div>
    <div class="state" id="stateLoading">
      <p>Comparando precios…</p>
    </div>
    <div class="state" id="stateError" hidden>
      <p id="errorMsg">No pudimos comparar esta publicación ahora mismo.</p>
    </div>

    <div id="result" hidden>
      <div class="product">
        <div class="product__thumb" id="prodThumb">🏄</div>
        <div>
          <div class="product__name" id="prodName"></div>
          <div class="product__meta">Detectado en esta publicación · Mercado Libre</div>
        </div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="savings" id="savings" hidden>
        <b id="savingsTitle"></b>
        <span id="savingsSub"></span>
      </div>
    </div>
  </main>

  <footer class="foot">
    <span id="updatedAt"></span>
    <a href="#" id="fullReportLink" target="_blank" rel="noopener">Ver informe completo →</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
