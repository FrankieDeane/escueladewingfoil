[build]
  publish = "."
  # Genera las fichas /spot-… y el <head> propio de /aprender, /spots, etc. a partir de index.html.
  # Si fallara, el sitio sigue andando igual (las reglas de abajo sirven index.html).
  command = "node scripts/gen-seo.mjs || echo 'gen-seo falló: se publica sin páginas generadas'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─── Security headers ───────────────────────────────────────────────────────
# Applied to every response. The CSP allows the inline scripts/styles the page
# relies on ('unsafe-inline') while still locking down where active content can
# be loaded from and blocking clickjacking, base-tag hijacking and plugins.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://unpkg.com https://webcams.windy.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://api.fontshare.com https://cdn.fontshare.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com https://windy.com https://www.windguru.cz https://www.openstreetmap.org https://webcams.windy.com; worker-src 'self' blob:; manifest-src 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Bramador: el service worker tiene que revisarse siempre, si no la app
# instalada se queda con la versión vieja.
[[headers]]
  for = "/bramador/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/bramador/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/bramador/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# El reporte de auditoría SEO vive en la raíz del repo (y por lo tanto se
# publica): que no lo indexe ningún buscador.
[[headers]]
  for = "/SEO_AUDIT_REPORT.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Dirección propia para la sección de equipos / dashboard de Mercado Libre
# (sirve como link fijo y como Redirect URI de la app de Mercado Libre).
# Muestra la home y el script del final de index.html baja a la sección.
# Páginas del sitio: el mismo index.html muestra solo las secciones de cada una.
[[redirects]]
  from = "/aprender"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/spots"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/instructores"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/equipos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/herramientas"
  to = "/equipos"
  status = 301

[[redirects]]
  from = "/articulos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/venta-de-wingfoil"
  to = "/index.html"
  status = 200
