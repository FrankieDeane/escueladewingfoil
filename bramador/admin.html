<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bramador · Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#0B1A22;--texto:#EAF2F8;--gris:#8FA9BF;--linea:rgba(255,255,255,.14);--senal:#FF5A2C;--ok:#22C3A6;--amarillo:#FFC531}
*{box-sizing:border-box}
body{margin:0;background:var(--tinta);color:var(--texto);font:15px/1.4 'DM Sans',sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 28px 'Bricolage Grotesque',sans-serif;margin:0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:26px 0 10px}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button,.btn,.chico{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--linea);background:transparent;color:var(--texto);font:800 14px 'DM Sans',sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--texto);color:var(--tinta)}
.btn{background:var(--senal);border:0;color:var(--tinta)}
.chico{min-height:34px;padding:0 10px;font-size:13px}
.caja{background:rgba(255,255,255,.04);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--gris)}
input,select{min-height:44px;border-radius:10px;border:1px solid var(--linea);background:rgba(0,0,0,.25);color:var(--texto);font:500 15px 'DM Sans',sans-serif;padding:0 10px}
input[type=checkbox]{min-height:0;width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.sp{display:flex;align-items:center;gap:12px}
.sp img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}
.sp .datos{flex:1;min-width:0}
.sp small{display:block;color:var(--gris)}
.on{color:var(--ok)}.off{color:var(--amarillo)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linea)}
th{color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.cifra{background:rgba(255,255,255,.04);border:1px solid var(--linea);border-radius:16px;padding:12px 14px}
.cifra b{display:block;font:800 38px/1 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.cifra span{display:block;margin-top:6px;font-size:12px;font-weight:800;color:var(--gris)}
.cifra--g{border-color:var(--senal)}.cifra--g b{color:var(--senal)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msj{color:var(--amarillo);font-weight:800}
.prev{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--gris)}
.prev img{width:28px;height:28px;border-radius:6px;background:#fff;object-fit:contain}
[hidden]{display:none!important}
.graf{background:rgba(255,255,255,.04);border:1px solid var(--linea);border-radius:16px;padding:12px 14px 8px;margin-bottom:10px}
.graf h3{margin:0 0 2px;font-size:15px}
.graf p{margin:0 0 8px;font-size:12px;color:var(--gris)}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf svg text{fill:var(--gris);font:600 15px 'DM Sans',sans-serif}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr 32px;gap:6px 8px;align-items:center;font-size:13px}
.hb i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--senal);min-width:2px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.buscar{width:100%;margin-bottom:8px}
.usuarios{max-height:520px;overflow:auto;border:1px solid var(--linea);border-radius:12px}
.usuarios table{font-size:13px}
.usuarios th{position:sticky;top:0;background:var(--tinta);cursor:pointer;white-space:nowrap}
.usuarios td{white-space:nowrap}
.acc{font-size:13px}.acc .mal{color:var(--amarillo)}
.seg{font-size:12px;color:var(--gris);margin-top:4px}
</style>
</head>
<body>
<main>
  <div class="cab"><h1>Bramador · Admin</h1><button class="chico" id="salir" hidden>Salir</button></div>

  <form id="login" class="caja" style="margin-top:16px">
    <label>Clave de admin<input id="clave" type="password" autocomplete="current-password" required></label>
    <p class="seg">Por seguridad: después de 5 intentos fallidos se bloquea 15 minutos, y la sesión se cierra sola tras 30 minutos sin uso o al cerrar la pestaña.</p>
    <p class="msj" id="loginMsj" hidden></p>
    <button class="btn" style="margin-top:10px">Entrar</button>
  </form>

  <div id="app" hidden>
    <div class="tabs"><button type="button" data-tab="dash" aria-pressed="true">Dashboard</button><button type="button" data-tab="sponsors" aria-pressed="false">Sponsors</button><button type="button" data-tab="panel" aria-pressed="false">Panel</button></div>

    <section id="tab-dash">
      <div id="dash"><p style="color:var(--gris)">Cargando…</p></div>
    </section>

    <section id="tab-sponsors" hidden>
      <form id="form" class="caja">
        <input type="hidden" id="fId">
        <div class="grid">
          <label>Marca<input id="fNombre" required maxlength="40"></label>
          <label>Spot<select id="fSpot"></select></label>
          <label>Dónde aparece<select id="fSlot"><option value="senal">Señal del día (SALÍ)</option><option value="alerta">Alertas de viento</option></select></label>
          <label>Desde<input id="fDesde" type="date" required></label>
          <label>Hasta<input id="fHasta" type="date" required></label>
          <label>Logo (se achica solo)<input id="fLogo" type="file" accept="image/*"></label>
        </div>
        <div class="prev" id="fPrev" hidden><img alt=""><span>Así se ve el logo</span></div>
        <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px"><input id="fActivo" type="checkbox" checked> Activo (destildalo para apagarlo; sus impresiones quedan guardadas)</label>
        <div class="fila" style="margin-top:10px"><button class="btn">Guardar sponsor</button><button class="chico" type="button" id="fNuevo">Nuevo</button></div>
        <p class="msj" id="fMsj" hidden></p>
      </form>
      <h2>Sponsors cargados</h2>
      <div id="lista"></div>
    </section>

    <section id="tab-panel" hidden>
      <div class="caja grid" style="align-items:end">
        <label>Desde<input id="pDesde" type="date"></label>
        <label>Hasta<input id="pHasta" type="date"></label>
        <button class="btn" type="button" id="pVer">Ver</button>
      </div>
      <div id="panel"></div>
    </section>
  </div>
</main>
<script>
(function(){
var SB = 'https://pfwazngwcvirdeyamvsd.supabase.co', SB_KEY = 'sb_publishable_5wLxVtnFy4IMOAMK_rzZ-A_cZ1TSOeV';
var SPOTS = {sanisidro:'San Isidro', peru:'Perú Beach', martinez:'Martínez', olivos:'Olivos', quilmes:'Quilmes', puntalara:'Punta Lara'};
var SLOTS = {senal:'Señal del día', alerta:'Alertas'};
var MPEST = {esperando_pago:'esperando el pago', pending:'esperando el pago', authorized:'suscripción activa, cobra solo cada mes', paused:'pausada por el sponsor', cancelled:'cancelada (sale cuando vence)'};
var ETIQ = {bien:'Todo bien', rachado:'Rachado', pocaagua:'Poca agua', gente:'Mucha gente', bajando:'Bajando el viento', ala:'Mi ala'};
var clave = '', sponsors = [], logoNuevo = null, datos = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rpc(fn, args){
  return fetch(SB + '/rest/v1/rpc/' + fn, {method:'POST', cache:'no-store', referrerPolicy:'no-referrer', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body: JSON.stringify(args || {})})
    .then(function(r){
      if (r.ok) return r.status === 204 ? null : r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        var e = new Error(fn); e.bloqueado = /bloqueado/.test(j && j.message || ''); throw e;
      });
    });
}
// Llamadas de admin: si el servidor devuelve vacío es que la clave ya no vale → afuera.
function adm(fn, args){
  args = args || {}; args.p_clave = clave;
  return rpc(fn, args).then(function(d){ if (d == null) { salir(); throw new Error('clave'); } return d; });
}
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

$('fSpot').innerHTML = '<option value="">Todos los spots</option>' + Object.keys(SPOTS).map(function(k){ return '<option value="' + k + '">' + SPOTS[k] + '</option>'; }).join('');

// La clave vive solo en esta pestaña (sessionStorage): al cerrarla hay que entrar de nuevo.
try { localStorage.removeItem('bram_admin'); } catch(e){}
function guardarClave(c){ try { c ? sessionStorage.setItem('bram_admin', c) : sessionStorage.removeItem('bram_admin'); } catch(e){} }
function entrar(c){
  return rpc('bram_admin_ok', {p_clave: c}).then(function(ok){
    if (!ok) throw new Error('clave');
    clave = c; guardarClave(c); $('clave').value = '';
    $('login').hidden = true; $('app').hidden = false; $('salir').hidden = false;
    tocar(); cargarSponsors(); verDash();
  });
}
function salir(){ clave = ''; guardarClave(''); location.reload(); }
$('login').addEventListener('submit', function(e){
  e.preventDefault();
  entrar($('clave').value.trim()).catch(function(err){
    $('loginMsj').textContent = err && err.bloqueado ? 'Demasiados intentos. Esperá 15 minutos y probá de nuevo.' : 'Clave incorrecta.';
    $('loginMsj').hidden = false;
  });
});
$('salir').addEventListener('click', salir);
try { var g = sessionStorage.getItem('bram_admin'); if (g) entrar(g).catch(function(){ guardarClave(''); }); } catch(e){}

// Cierre automático tras 30 minutos sin tocar nada.
var ultimo = Date.now();
function tocar(){ ultimo = Date.now(); }
['click','keydown','scroll','touchstart'].forEach(function(ev){ addEventListener(ev, tocar, {passive:true}); });
setInterval(function(){ if (clave && Date.now() - ultimo > 30 * 60 * 1000) salir(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && clave && Date.now() - ultimo > 30 * 60 * 1000) salir(); });

document.querySelectorAll('[data-tab]').forEach(function(b){ b.addEventListener('click', function(){
  document.querySelectorAll('[data-tab]').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
  ['dash','sponsors','panel'].forEach(function(t){ $('tab-' + t).hidden = b.dataset.tab !== t; });
  if (b.dataset.tab === 'panel' && !datos) verPanel();
}); });

// ── Dashboard
var dash = null, personas = [], orden = {k: 'creado', d: -1}, filtro = '';
function fecha(t, hora){
  if (!t) return '—';
  var d = new Date(t); if (isNaN(d)) return '—';
  var s = d.getDate() + '/' + (d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
  return hora ? s + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : s;
}
function diaLocal(t){ var d = new Date(t); return iso(d); }
function nf(n){ return Number(n || 0).toLocaleString('es-AR'); }
// Una persona = un mail (puede tener la app en varios dispositivos).
function agrupar(us){
  var m = {};
  us.forEach(function(u){
    var k = String(u.mail || '').trim().toLowerCase() || ('sin-mail-' + Math.random());
    var p = m[k];
    if (!p) p = m[k] = {nombre: u.nombre || '', apellido: u.apellido || '', mail: u.mail || '', creado: u.creado, visto: u.visto, alas: 0, reportes: 0, ultimo_reporte: null, disp: 0};
    p.disp++;
    if (u.creado && u.creado < p.creado) p.creado = u.creado;
    if (u.visto && (!p.visto || u.visto > p.visto)) p.visto = u.visto;
    if (!p.nombre && u.nombre) p.nombre = u.nombre;
    if (!p.apellido && u.apellido) p.apellido = u.apellido;
    p.alas = Math.max(p.alas, (u.alas || []).length);
    p.reportes += u.reportes || 0;
    if (u.ultimo_reporte && (!p.ultimo_reporte || u.ultimo_reporte > p.ultimo_reporte)) p.ultimo_reporte = u.ultimo_reporte;
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}
// Gráfico de barras verticales (SVG, sin librerías). Con acum=true dibuja además la línea del total.
function barras(filas, kx, ky, op){
  op = op || {};
  var W = 600, H = 200, pl = 36, pb = 26, pt = 12, n = filas.length;
  if (!n) return '<p>Sin datos todavía.</p>';
  var max = Math.max.apply(null, filas.map(function(f){ return op.acum ? f._acum : f[ky]; }).concat([1]));
  var paso = Math.pow(10, Math.floor(Math.log10(max))), tope = Math.ceil(max / paso) * paso;
  var y = function(v){ return pt + (H - pt - pb) * (1 - v / tope); };
  var bw = (W - pl) / n, g = '';
  [0, .5, 1].forEach(function(f){ var v = Math.round(tope * f); g += '<line x1="' + pl + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(255,255,255,.1)"/><text x="' + (pl - 4) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
  var maxB = op.acum ? Math.max.apply(null, filas.map(function(f){ return f[ky]; }).concat([1])) : tope;
  var yb = op.acum ? function(v){ return pt + (H - pt - pb) * (1 - v / maxB * .45); } : y;
  filas.forEach(function(f, i){
    var x = pl + i * bw, v = f[ky] || 0, h = (H - pb) - yb(v);
    g += '<rect x="' + (x + bw * .12).toFixed(1) + '" y="' + yb(v).toFixed(1) + '" width="' + Math.max(1, bw * .76).toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" rx="2" fill="' + (op.acum ? 'rgba(255,90,44,.45)' : 'var(--senal)') + '"><title>' + esc(f[kx]) + ': ' + v + '</title></rect>';
    var cada = Math.ceil(n / 6);
    if (i % cada === 0 || i === n - 1) g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(op.etq ? op.etq(f[kx]) : f[kx]) + '</text>';
  });
  if (op.acum) {
    var pts = filas.map(function(f, i){ return (pl + i * bw + bw / 2).toFixed(1) + ',' + y(f._acum).toFixed(1); });
    g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linejoin="round"/>';
    var u = filas[n - 1];
    g += '<circle cx="' + (pl + (n - 1) * bw + bw / 2).toFixed(1) + '" cy="' + y(u._acum).toFixed(1) + '" r="4" fill="var(--ok)"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
}
function hbarras(filas, ke, kv, fmt){
  if (!filas.length) return '<p>Sin datos todavía.</p>';
  var max = Math.max.apply(null, filas.map(function(f){ return f[kv]; }).concat([1]));
  return '<div class="hb">' + filas.map(function(f){
    return '<span>' + esc(fmt ? fmt(f[ke]) : f[ke]) + '</span><i style="width:' + (f[kv] / max * 100).toFixed(1) + '%"></i><b>' + f[kv] + '</b>';
  }).join('') + '</div>';
}
function graf(t, sub, cont){ return '<div class="graf"><h3>' + t + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + cont + '</div>'; }
function verDash(){
  adm('bram_admin_usuarios').then(function(d){
    dash = d; personas = agrupar(d.usuarios || []);
    var hoyS = iso(new Date()), hace7 = Date.now() - 7 * 864e5;
    var activosHoy = personas.filter(function(p){ return p.visto && diaLocal(p.visto) === hoyS; }).length;
    var activos7 = personas.filter(function(p){ return p.visto && new Date(p.visto) > hace7; }).length;
    var nuevos7 = personas.filter(function(p){ return new Date(p.creado) > hace7; }).length;
    var nuevosHoy = personas.filter(function(p){ return diaLocal(p.creado) === hoyS; }).length;
    var conAlas = personas.filter(function(p){ return p.alas > 0; }).length;
    var reportan = personas.filter(function(p){ return p.reportes > 0; }).length;
    function cifra(n, t, g){ return '<div class="cifra' + (g ? ' cifra--g' : '') + '"><b>' + nf(n) + '</b><span>' + t + '</span></div>'; }
    // Altas por día, con los días sin altas en 0 y el total acumulado.
    var altas = {}; (d.altas_dia || []).forEach(function(f){ altas[f.dia] = f.altas; });
    var serie = [], dias = Object.keys(altas).sort();
    if (dias.length) {
      var acum = 0, x = new Date(dias[0] + 'T12:00:00'), fin = new Date();
      for (; iso(x) <= iso(fin); x.setDate(x.getDate() + 1)) { var k = iso(x); acum += altas[k] || 0; serie.push({dia: k, altas: altas[k] || 0, _acum: acum}); }
    }
    var act = {}; (d.activos_dia || []).forEach(function(f){ act[f.dia] = f.usuarios; });
    var serieAct = []; for (var i = 29; i >= 0; i--) { var dd = new Date(Date.now() - i * 864e5), kk = iso(dd); serieAct.push({dia: kk, usuarios: act[kk] || 0}); }
    var horas = {}; (d.hora_alta || []).forEach(function(f){ horas[f.hora] = f.altas; });
    var serieH = []; for (var h = 0; h < 24; h++) serieH.push({hora: h, altas: horas[h] || 0});
    var etqDia = function(s){ var p = String(s).split('-'); return +p[2] + '/' + +p[1]; };
    var conv = personas.length ? Math.round(conAlas / personas.length * 100) : 0;
    $('dash').innerHTML =
      '<div class="cifras">' + cifra(personas.length, 'personas (mails distintos)', true) + cifra((d.usuarios || []).length, 'dispositivos con la app') +
      cifra(nuevosHoy, 'nuevos hoy') + cifra(nuevos7, 'nuevos en 7 días') + cifra(activosHoy, 'abrieron la app hoy') + cifra(activos7, 'activos en 7 días') +
      cifra(conAlas, 'cargaron sus alas (' + conv + '%)') + cifra(reportan, 'reportaron el río') + '</div>' +
      graf('Crecimiento de usuarios', 'Barras: altas de cada día · Línea verde: total acumulado (' + nf(serie.length ? serie[serie.length - 1]._acum : 0) + ')', barras(serie, 'dia', 'altas', {acum: true, etq: etqDia})) +
      '<div class="dos">' +
        graf('Usuarios activos por día', 'Últimos 30 días, según la última vez que abrieron la app', barras(serieAct, 'dia', 'usuarios', {etq: etqDia})) +
        graf('A qué hora se registran', 'Hora de Argentina', barras(serieH, 'hora', 'altas', {etq: function(h){ return h + 'h'; }})) +
      '</div><div class="dos">' +
        graf('Marcas de ala', 'Riders que tienen cada marca', hbarras((d.marcas || []).slice(0, 10), 'marca', 'riders')) +
        graf('Medidas de ala', 'Cantidad de alas por tamaño', hbarras(d.medidas || [], 'm', 'alas', function(m){ return m + ' m'; })) +
        graf('Qué reportan en el río', 'Total de reportes por tipo', hbarras(d.reportes_tag || [], 'tag', 'reportes', function(v){ return valor('tag', v); })) +
      '</div>' +
      '<div class="fila"><h2>Usuarios (' + personas.length + ')</h2><button class="chico" type="button" id="uCsv">Bajar CSV</button></div>' +
      '<input class="buscar" id="uBuscar" type="search" placeholder="Buscar por nombre, apellido o mail" value="' + esc(filtro) + '">' +
      '<div class="usuarios"><table id="uTabla"></table></div>' +
      '<h2>Seguridad · últimos accesos al admin</h2><div class="caja acc">' + ((d.accesos || []).length ? '<table>' + d.accesos.map(function(a){
        return '<tr><td>' + fecha(a.t, true) + '</td><td class="' + (a.ok ? 'on">✓ Entró' : 'mal">✗ Clave incorrecta') + '</td><td style="color:var(--gris)">' + esc(a.ip) + '</td></tr>';
      }).join('') + '</table>' : '<p style="margin:0;color:var(--gris)">Sin accesos registrados.</p>') +
      '<p class="seg">Si ves intentos con clave incorrecta que no son tuyos, avisame y cambiamos la clave.</p></div>';
    pintarUsuarios();
  }).catch(function(e){ if (clave) $('dash').innerHTML = '<p class="msj">No se pudo cargar el dashboard. ' + (e && e.bloqueado ? 'Demasiados intentos: esperá 15 minutos.' : 'Probá recargar.') + '</p>'; });
}
var COLS = [['nombre','Nombre'],['apellido','Apellido'],['mail','Mail'],['creado','Alta'],['visto','Última vez'],['disp','Disp.'],['alas','Alas'],['reportes','Reportes']];
function visibles(){
  var q = filtro.trim().toLowerCase();
  return personas.filter(function(p){ return !q || (p.nombre + ' ' + p.apellido + ' ' + p.mail).toLowerCase().indexOf(q) >= 0; })
    .sort(function(a, b){ var x = a[orden.k], y = b[orden.k]; x = x == null ? '' : x; y = y == null ? '' : y;
      if (typeof x === 'string') { x = x.toLowerCase(); y = String(y).toLowerCase(); }
      return x < y ? -orden.d : x > y ? orden.d : 0; });
}
function pintarUsuarios(){
  var t = $('uTabla'); if (!t) return;
  var l = visibles();
  t.innerHTML = '<tr>' + COLS.map(function(c){ return '<th data-orden="' + c[0] + '">' + c[1] + (orden.k === c[0] ? (orden.d > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr>' +
    (l.length ? l.map(function(p){
      return '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(p.apellido) + '</td><td>' + esc(p.mail) + '</td><td>' + fecha(p.creado) + '</td><td>' + fecha(p.visto, true) +
        '</td><td class="n">' + p.disp + '</td><td class="n">' + p.alas + '</td><td class="n">' + p.reportes + '</td></tr>';
    }).join('') : '<tr><td colspan="8" style="color:var(--gris)">Nadie coincide con la búsqueda.</td></tr>');
}
$('dash').addEventListener('input', function(e){ if (e.target.id === 'uBuscar') { filtro = e.target.value; pintarUsuarios(); } });
$('dash').addEventListener('click', function(e){
  var th = e.target.closest('[data-orden]');
  if (th) { var k = th.dataset.orden; orden = {k: k, d: orden.k === k ? -orden.d : (k === 'nombre' || k === 'apellido' || k === 'mail' ? 1 : -1)}; pintarUsuarios(); return; }
  if (e.target.id === 'uCsv') {
    var csv = [COLS.map(function(c){ return c[1]; })].concat(visibles().map(function(p){ return [p.nombre, p.apellido, p.mail, fecha(p.creado), fecha(p.visto, true), p.disp, p.alas, p.reportes]; }))
      .map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'}));
    a.download = 'bramador-usuarios-' + iso(new Date()) + '.csv';
    a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
});

// ── Sponsors
function limpiar(){
  $('form').reset(); $('fId').value = ''; logoNuevo = null; $('fPrev').hidden = true; $('fActivo').checked = true;
  var hoy = new Date(); $('fDesde').value = iso(hoy); $('fHasta').value = iso(new Date(hoy.getFullYear(), hoy.getMonth() + 3, 0));
}
limpiar();
$('fNuevo').addEventListener('click', limpiar);
$('fLogo').addEventListener('change', function(){
  var f = this.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function(){
    // Logo cuadrado de 96 px: liviano para que no demore nada en la app.
    var c = document.createElement('canvas'), L = 96, k = Math.min(L / img.width, L / img.height);
    c.width = L; c.height = L;
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, L, L);
    x.drawImage(img, (L - img.width * k) / 2, (L - img.height * k) / 2, img.width * k, img.height * k);
    logoNuevo = c.toDataURL('image/webp', 0.85);
    if (logoNuevo.indexOf('data:image/webp') !== 0) logoNuevo = c.toDataURL('image/png');
    $('fPrev').querySelector('img').src = logoNuevo; $('fPrev').hidden = false;
    URL.revokeObjectURL(url);
  };
  img.src = url;
});
$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var p = {id: $('fId').value, nombre: $('fNombre').value.trim(), spot: $('fSpot').value, slot: $('fSlot').value,
           desde: $('fDesde').value, hasta: $('fHasta').value, activo: $('fActivo').checked};
  if (logoNuevo) p.logo = logoNuevo;
  if (p.hasta < p.desde) { $('fMsj').textContent = '"Hasta" tiene que ser después de "Desde".'; $('fMsj').hidden = false; return; }
  adm('bram_admin_guardar_sponsor', {p: p}).then(function(){
    $('fMsj').textContent = '✓ Guardado'; $('fMsj').hidden = false; limpiar(); cargarSponsors();
  }).catch(function(){ $('fMsj').textContent = 'No se pudo guardar. Probá de nuevo.'; $('fMsj').hidden = false; });
});
function cargarSponsors(){
  adm('bram_admin_sponsors').then(function(l){
    sponsors = l || [];
    var hoy = iso(new Date());
    // Pedidos online que nunca se pagaron: aparte, para no ensuciar la lista.
    function sinPagar(s){ return s.origen === 'mp' && !s.activo && (s.mp_estado === 'esperando_pago' || s.mp_estado === 'pending'); }
    function tarjeta(s, i){
      var vigente = s.activo && s.desde <= hoy && hoy <= s.hasta;
      return '<div class="caja sp">' + (s.logo ? '<img src="' + esc(s.logo) + '" alt="">' : '<img alt="">') +
        '<div class="datos"><b>' + esc(s.nombre) + '</b> <span class="' + (vigente ? 'on">● al aire' : 'off">● ' + (s.activo ? 'fuera de fecha' : 'apagado')) + '</span>' +
        '<small>' + (s.spot ? SPOTS[s.spot] : 'Todos los spots') + ' · ' + SLOTS[s.slot] + ' · ' + s.desde + ' → ' + s.hasta + ' · ' + Number(s.impresiones).toLocaleString('es-AR') + ' impresiones</small>' +
        (s.origen === 'mp' ? '<small>💳 Mercado Pago: ' + esc(MPEST[s.mp_estado] || s.mp_estado || '—') + (s.mail ? ' · ' + esc(s.mail) : '') + '</small>' : '') + '</div>' +
        '<button class="chico" type="button" data-editar="' + i + '">Editar</button></div>';
    }
    var html = '', pend = '', nPend = 0;
    sponsors.forEach(function(s, i){ if (sinPagar(s)) { pend += tarjeta(s, i); nPend++; } else html += tarjeta(s, i); });
    $('lista').innerHTML = (html || '<p style="color:var(--gris)">Todavía no hay sponsors.</p>') +
      (nPend ? '<details class="caja"><summary style="cursor:pointer;font-weight:800">Pedidos online sin pagar (' + nPend + ')</summary><div style="margin-top:10px">' + pend + '</div></details>' : '');
  });
}
$('lista').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.editar != null) {
    var s = sponsors[+b.dataset.editar];
    $('fId').value = s.id; $('fNombre').value = s.nombre; $('fSpot').value = s.spot || ''; $('fSlot').value = s.slot;
    $('fDesde').value = s.desde; $('fHasta').value = s.hasta; $('fActivo').checked = s.activo; logoNuevo = null;
    if (s.logo) { $('fPrev').querySelector('img').src = s.logo; $('fPrev').hidden = false; } else $('fPrev').hidden = true;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});

// ── Panel
var hoy = new Date(); $('pDesde').value = iso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)); $('pHasta').value = iso(hoy);
$('pVer').addEventListener('click', verPanel);
var TABLAS = [
  ['usuarios_dia', 'Usuarios nuevos por día', ['dia','altas']],
  ['impresiones', 'Impresiones por sponsor', ['mes','sponsor','slot','spot','impresiones']],
  ['reportes_dia', 'Reportes por spot y día', ['dia','spot','reportes','riders']],
  ['riders_semana', 'Riders que reportaron, por semana', ['semana','riders']],
  ['riders_mes', 'Riders que reportaron, por mes', ['mes','riders']],
  ['dias_viento', 'Días de viento (12 kn o más) con actividad', ['dia','spot','kn_max','reportes','riders']],
  ['alas_medida', 'Medidas de ala por spot', ['spot','m','riders']],
  ['alas_marca', 'Marcas de ala por spot', ['spot','marca','riders']],
  ['etiquetas', 'Qué reportan, por spot', ['spot','tag','reportes']]
];
var TITULOS = {altas:'Usuarios nuevos', mes:'Mes', sponsor:'Sponsor', slot:'Dónde', spot:'Spot', impresiones:'Impresiones', dia:'Día', reportes:'Reportes', riders:'Riders', semana:'Semana del', kn_max:'Kn máx', m:'Medida (m)', marca:'Marca', tag:'Reporte'};
function valor(k, v){ return k === 'spot' ? (SPOTS[v] || v) : k === 'slot' ? (SLOTS[v] || v) : k === 'tag' ? (ETIQ[v] || (String(v).indexOf('no_') === 0 ? 'Ya no: ' + (ETIQ[v.slice(3)] || v) : v)) : v; }
function verPanel(){
  $('panel').innerHTML = '<p style="color:var(--gris)">Cargando…</p>';
  adm('bram_admin_panel', {p_desde: $('pDesde').value, p_hasta: $('pHasta').value}).then(function(d){
    datos = d;
    var u = d.usuarios_resumen || {total: d.riders_total};
    function cifra(n, t, g){ return '<div class="cifra' + (g ? ' cifra--g' : '') + '"><b>' + (n == null ? 0 : n) + '</b><span>' + t + '</span></div>'; }
    $('panel').innerHTML = '<h2>Usuarios</h2><div class="cifras">' + cifra(u.total, 'registrados en total', true) + cifra(u.hoy, 'hoy') + cifra(u.ult7, 'últimos 7 días') +
      cifra(u.con_alas, 'cargaron sus alas') + cifra(u.con_reportes, 'reportaron el río') + '</div>' + TABLAS.map(function(t, i){
      var filas = d[t[0]] || [];
      return '<div class="fila"><h2>' + t[1] + '</h2><button class="chico" type="button" data-csv="' + i + '">CSV</button></div>' +
        (filas.length ? '<div class="tabla"><table><tr>' + t[2].map(function(k){ return '<th>' + TITULOS[k] + '</th>'; }).join('') + '</tr>' +
        filas.map(function(f){ return '<tr>' + t[2].map(function(k){ return '<td' + (typeof f[k] === 'number' ? ' class="n"' : '') + '>' + esc(valor(k, f[k])) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</table></div>' : '<p style="color:var(--gris);margin:0">Sin datos en estas fechas.</p>');
    }).join('');
  }).catch(function(){ $('panel').innerHTML = '<p class="msj">No se pudo cargar el panel.</p>'; });
}
$('panel').addEventListener('click', function(e){
  var b = e.target.closest('[data-csv]'); if (!b || !datos) return;
  var t = TABLAS[+b.dataset.csv], filas = datos[t[0]] || [];
  var csv = [t[2].map(function(k){ return TITULOS[k]; })].concat(filas.map(function(f){ return t[2].map(function(k){ return valor(k, f[k]); }); }))
    .map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'}));
  a.download = 'bramador-' + t[0] + '-' + $('pDesde').value + '-a-' + $('pHasta').value + '.csv';
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
});
})();
</script>
</body>
</html>
