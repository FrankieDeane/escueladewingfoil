<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Gracias! · Sponsors de Bramador</title>
<meta name="theme-color" content="#0B1A22">
<link rel="icon" href="/bramador/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:wght@400;700;800&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VJMGLED2P8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VJMGLED2P8');
</script>
<style>
:root{--tinta:#0B1A22;--hondo:#10242F;--linea:rgba(255,255,255,.12);--texto:#EAF2F8;--gris:#8FA9BF;--senal:#FF5A2C;--ok:#22C3A6;--amarillo:#FFC531;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 80% at 80% 0%,#1C4A5E 0%,transparent 60%),var(--tinta);color:var(--texto);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:560px;padding:32px max(16px,env(safe-area-inset-left,0px));text-align:center}
.ico{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:rgba(34,195,166,.14);color:var(--ok)}
.ico svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico--espera{background:rgba(255,197,49,.14);color:var(--amarillo)}
h1{font:800 clamp(32px,7vw,48px)/1.02 "Bricolage Grotesque",sans-serif;margin:0 0 12px;text-wrap:balance}
p{margin:0 0 12px;color:var(--gris);font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--senal);color:#1a0a04;font-weight:800;text-decoration:none}
a.btn--2{background:transparent;border:1px solid var(--linea);color:var(--texto)}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="ico ico--espera" id="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
  <h1 id="tit">Revisando tu pago…</h1>
  <p id="txt">Estamos confirmando con Mercado Pago. Esto tarda unos segundos.</p>
  <div class="btns"><a class="btn" href="/bramador/">Abrir Bramador</a><a class="btn btn--2" href="https://wa.me/5491120498620?text=Hola%20Francisco%2C%20acabo%20de%20contratar%20un%20spot%20en%20Bramador" target="_blank" rel="noopener">¿Dudas? WhatsApp</a></div>
</main>
<script>
(function(){
  var FN = 'https://pfwazngwcvirdeyamvsd.supabase.co/functions/v1/bramador-sponsor';
  var m = /[?&]g=([0-9a-f-]{36})/.exec(location.search), g = m && m[1], intentos = 0;
  function $(id){ return document.getElementById(id); }
  function listo(){
    $('ico').className = 'ico'; $('ico').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    $('tit').textContent = '¡Listo! Tu marca ya está en Bramador';
    $('txt').textContent = 'Desde ahora aparece en los spots que elegiste, en la señal del día y en los avisos de viento. Cada mes se renueva solo con Mercado Pago.';
    try { gtag('event', 'sponsor_pago_ok'); } catch(e){}
  }
  function espera(){
    $('tit').textContent = '¡Gracias! Tu pago se está procesando';
    $('txt').textContent = 'Apenas Mercado Pago lo acredite, tu marca aparece sola en la app (puede tardar unas horas). No tenés que hacer nada más.';
  }
  function revisar(){
    if (!g) return espera();
    fetch(FN, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({accion:'sincronizar', grupo: g})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.activo) return listo(); if (++intentos < 4) return setTimeout(revisar, 5000); espera(); })
      .catch(function(){ espera(); });
  }
  revisar();
})();
</script>
</body>
</html>
